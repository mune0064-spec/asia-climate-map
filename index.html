/* =====================================================
   3. マーカー管理
===================================================== */

let markers = [];


/* =====================================================
   4. 気候判定
===================================================== */

function getClimateStatus(city, monthIndex) {

  const rain = city.rain[monthIndex];
  const temp = city.temp[monthIndex];

  /*
    旅行者向けの簡易判定。

    かなり雨が少ない
    ＋
    20〜32℃程度
  */

  if (
    rain <= 100 &&
    temp >= 20 &&
    temp <= 32
  ) {

    return "dry";

  }

  if (rain >= 200) {

    return "rain";

  }

  return "normal";

}


/* =====================================================
   5. 色
===================================================== */

function getColor(status) {

  if (status === "dry") {

    return "#1976d2";

  }

  if (status === "rain") {

    return "#e64a19";

  }

  return "#777";

}


/* =====================================================
   6. ランキングスコア
===================================================== */

function getScore(city, monthIndex) {

  const rain = city.rain[monthIndex];
  const temp = city.temp[monthIndex];

  /*
    雨が少ないほど高得点

    快適気温
    24〜30℃を中心に評価
  */

  let rainScore;

  if (rain <= 50) {

    rainScore = 100;

  } else if (rain <= 100) {

    rainScore = 90;

  } else if (rain <= 150) {

    rainScore = 75;

  } else if (rain <= 200) {

    rainScore = 55;

  } else if (rain <= 300) {

    rainScore = 30;

  } else {

    rainScore = 10;

  }


  let tempScore;

  if (temp >= 24 && temp <= 30) {

    tempScore = 100;

  } else if (temp >= 21 && temp <= 32) {

    tempScore = 80;

  } else if (temp >= 18 && temp <= 34) {

    tempScore = 60;

  } else {

    tempScore = 30;

  }


  /*
    降水量を60%
    気温を40%
  */

  return Math.round(
    rainScore * 0.6 +
    tempScore * 0.4
  );

}


/* =====================================================
   7. ポップアップ
===================================================== */

function createPopup(city, monthIndex) {

  const month = monthIndex + 1;

  let html = `

    <div class="city-popup">

      <h3>
        ${city.name}
      </h3>

      <div class="city-info">

        <b>${city.country}</b><br>

        ${month}月の平均気温：
        <b>${city.temp[monthIndex]}℃</b><br>

        ${month}月の降水量：
        <b>${city.rain[monthIndex]} mm</b>

      </div>

      <hr>

      <b>12ヶ月の気候</b>

      <table class="month-table">

        <tr>
          <th>月</th>
          <th>気温</th>
          <th>雨</th>
        </tr>

  `;


  for (let i = 0; i < 12; i++) {

    const status =
      getClimateStatus(city, i);

    let className =
      status === "dry"
        ? "good"
        : status === "rain"
        ? "bad"
        : "normal";


    html += `

      <tr>

        <td>${i + 1}月</td>

        <td>
          ${city.temp[i]}℃
        </td>

        <td class="${className}">
          ${city.rain[i]}mm
        </td>

      </tr>

    `;

  }


  html += `

      </table>

    </div>

  `;

  return html;

}


/* =====================================================
   8. 地図更新
===================================================== */

function updateMap() {

  const month =
    parseInt(
      document.getElementById("month").value,
      10
    );

  const monthIndex =
    month - 1;


  /* 既存マーカー削除 */

  markers.forEach(marker => {

    map.removeLayer(marker);

  });

  markers = [];


  /* 都市を表示 */

  cities.forEach(city => {

    const rainfall =
      city.rain[monthIndex];

    const temperature =
      city.temp[monthIndex];

    const status =
      getClimateStatus(
        city,
        monthIndex
      );

    const color =
      getColor(status);


    /*
      降水量によって円サイズ変更
    */

    const radius =
      Math.max(
        8,
        Math.min(
          32,
          7 + Math.sqrt(rainfall) * 1.3
        )
      );


    const marker =
      L.circleMarker(
        [city.lat, city.lng],
        {

          radius: radius,

          fillColor: color,

          color: "#ffffff",

          weight: 2,

          opacity: 1,

          fillOpacity: 0.78

        }
      );


    marker.bindPopup(
      createPopup(
        city,
        monthIndex
      )
    );


    marker.addTo(map);

    markers.push(marker);

  });


  updateRanking(monthIndex);

}


/* =====================================================
   9. ランキング
===================================================== */

function updateRanking(monthIndex) {

  const ranking =
    cities
      .map(city => {

        return {

          city: city,

          score:
            getScore(
              city,
              monthIndex
            )

        };

      })
      .sort(
        (a,b) =>
          b.score - a.score
      );


  const container =
    document.getElementById(
      "ranking-list"
    );


  container.innerHTML = "";


  ranking.forEach(
    (item, index) => {

      const city =
        item.city;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "rank-item";


      div.innerHTML = `

        <div class="rank-number">
          ${index + 1}
        </div>

        <div class="rank-name">

          <b>
            ${city.name}
          </b>

          <br>

          <small>
            ${city.temp[monthIndex]}℃
            /
            ${city.rain[monthIndex]}mm
          </small>

        </div>

        <div class="rank-score">
          ${item.score}点
        </div>

      `;


      /*
        ランキングをクリックすると
        地図上の都市を開く
      */

      div.addEventListener(
        "click",
        () => {

          const markerIndex =
            cities.indexOf(city);


          const marker =
            markers[markerIndex];


          if (marker) {

            map.setView(
              [
                city.lat,
                city.lng
              ],
              7
            );


            marker.openPopup();

          }

        }
      );


      container.appendChild(div);

    }
  );

}

</script>
